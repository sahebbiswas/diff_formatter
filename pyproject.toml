[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-formatter"
version = "0.1.0"
description = "Custom C code formatter that only touches modified lines from git/p4 diffs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Saheb Biswas"}
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=cstyle --cov-report=term-missing"

[tool.setuptools.packages.find]
where = ["."]
include = ["cstyle*"]  # if you later split into a package
